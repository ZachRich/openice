<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>North Shore Ice Finder</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">01960 • North Shore, Massachusetts</p>
          <h1>Find more ice.</h1>
          <p class="subtitle">A live list of nearby stick &amp; puck, stick time, and optional pickup hockey.</p>
        </div>
        <button id="refresh" type="button">Refresh schedules</button>
      </header>
      <section class="controls" aria-label="Schedule filters">
        <label>Show
          <select id="days"><option value="7">next 7 days</option><option value="14">next 14 days</option><option value="30" selected>next 30 days</option><option value="60">next 60 days</option></select>
        </label>
        <label class="toggle"><input id="pickup" type="checkbox"> Include pickup hockey</label>
        <span id="updated" aria-live="polite"></span>
      </section>
      <section id="schedule" aria-live="polite"><p class="loading">Loading schedules…</p></section>
      <section class="sources">
        <div><p class="eyebrow">Source health</p><h2>What’s being checked</h2></div>
        <div id="source-list"></div>
      </section>
    </main>
    <template id="event-template">
      <article class="event"><div class="date"></div><div class="details"><div class="title-row"><h3></h3><span class="badge"></span></div><p class="where"></p><p class="notes"></p></div><a class="go" target="_blank" rel="noreferrer">Rink site <span>↗</span></a></article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
